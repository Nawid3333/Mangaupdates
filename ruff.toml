line-length = 120
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"

[lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
fixable = ["ALL"]

[lint.pydocstyle]
convention = "google"

# Type errors are not ruff's job and cannot be made ruff's job -- it has no
# type inference. Those are checked by pyright; see [tool.pyright] in
# pyproject.toml, and run `npx pyright` alongside `ruff check`.
