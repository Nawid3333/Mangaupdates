# Known vulnerabilities in the dependencies as they are actually installed, on
# every pull request and push to main, and every Monday from weekly-check.yml.
# requirements.txt is unpinned, so GitHub's dependency graph cannot know which
# versions get installed; pip-audit resolves them the way pip does and checks
# each against the PyPI advisory database.
#
# A workflow of its own, not a job in ci.yml: auto-release.yml releases what a
# green CI run on main tested, and a new advisory is news, but it should not
# hold back releasing an unrelated fix.
name: Dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Called by weekly-check.yml. The schedule lives there, for the reason ci.yml
  # gives.
  workflow_call:

# A called run takes the caller's name as github.workflow; the prefix keeps its
# group apart from the caller's own.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # As in ci.yml: nothing here pushes, so the token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          cache: pip

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off
