# Runs the test suite on every push and pull request. release.yml runs the same
# suite, but only once a release is published -- by then a broken commit is
# already on main and tagged. This is the same check, moved earlier.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runnable by hand from the Actions tab on any branch, e.g. to check a
  # feature branch before opening a PR. Only a push to main can lead to a
  # release: auto-release.yml checks the triggering event.
  workflow_dispatch:

# A newer push to the same branch or PR makes the older run pointless, so it
# is cancelled instead of finishing on a Windows runner. On main that is
# safe for releases too: auto-release.yml skips the cancelled run, and the run
# for the newer commit releases every commit since the last tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Matches release.yml: windows-latest is the only platform this suite has
    # been run on, so keeping CI on the same runner means a green CI run
    # actually predicts a green release build.
    runs-on: windows-latest
    # A test that hangs on a network call would otherwise hold the runner for
    # GitHub's 6-hour default. The whole job normally takes a few minutes.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The floor declared in requires-python, as in release.yml: testing
          # the oldest supported version is what catches a newer-only API
          # slipping in.
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m pyright

      - name: Test
        # As in release.yml: the suite runs without credentials and without the
        # captured fixtures, which are not in git; the tests needing either
        # skip themselves.
        run: python -m pytest
