# Runs the test suite on every push and pull request. release.yml runs the same
# suite, but only once a release is published -- by then a broken commit is
# already on main and tagged. This is the same check, moved earlier.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runnable by hand from the Actions tab on any branch, e.g. to check a
  # feature branch before opening a PR. Only a push to main can lead to a
  # release: auto-release.yml checks the triggering event.
  workflow_dispatch:
  # Called by weekly-check.yml (every Monday, against the newest Python and
  # dependency releases) and by runner-images.yml (on a new runner image). The
  # schedules live there, not here: GitHub disables a public repository's
  # scheduled workflows after 60 days without a commit, and it disables the
  # whole file, so a schedule here would take the push trigger - CI and
  # releases - down with it.
  workflow_call:
    inputs:
      # No Linux job here; accepted so that every repository's CI takes the same inputs.
      linux-runner:
        type: string
        default: ubuntu-latest
      windows-runner:
        type: string
        default: windows-latest

# A newer push to the same branch or PR makes the older run pointless, so it
# is cancelled instead of finishing on a Windows runner. On main that is
# safe for releases too: auto-release.yml skips the cancelled run, and the run
# for the newer commit releases every commit since the last tag.
# Per workflow, event and image as well: a called run takes the caller's name
# as github.workflow, so a weekly or runner-image run and a push never cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.windows-runner }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor in requires-python - testing the oldest supported
        # version is what catches a newer-only API slipping in. 3.x is the newest
        # stable release, which is what a fresh install, and the maintainer's own
        # machine, actually runs.
        python-version: ['3.11', '3.x']
    # Matches release.yml: windows-latest is the only platform this suite has
    # been run on, so keeping CI on the same runner means a green CI run
    # actually predicts a green release build.
    runs-on: ${{ inputs.windows-runner || 'windows-latest' }}
    # A test that hangs on a network call would otherwise hold the runner for
    # GitHub's 6-hour default. The whole job normally takes a few minutes.
    timeout-minutes: 20

    steps:
      # Nothing here pushes, so the job's token is not left in .git/config,
      # where every later step -- the dependency installs included -- could
      # read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # uv in place of pip: the same packages from the same unpinned
      # requirements, resolved and installed several times faster. --system
      # installs into the Python that setup-python just set up, so every step
      # below runs exactly as it did under pip. Its cache, keyed on
      # requirements.txt and pyproject.toml, replaces setup-python's pip cache;
      # a cached run still resolves against the live index, so the weekly check
      # still gets the newest releases.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install
        run: uv pip install --system -r requirements.txt ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m pyright

      - name: Test
        # As in release.yml: the suite runs without credentials and without the
        # captured fixtures, which are not in git; the tests needing either
        # skip themselves.
        run: python -m pytest
