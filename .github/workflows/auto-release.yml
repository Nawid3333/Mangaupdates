# Bumps the version and cuts a release automatically, driven by Conventional
# Commits, but only after the CI workflow (lint, format, type check, tests)
# has passed on that exact commit -- ci.yml and this workflow used to both
# trigger independently on `push: branches: [main]`, which meant a broken
# commit could get auto-tagged and released before, or even if, CI failed.
# Triggering on `workflow_run: ["CI"]` instead makes this wait for that run
# to finish, and the job condition below restricts it to a *successful* CI
# run that was itself triggered by a push to main (not a pull_request run).
# Checks out `head_branch` (main), not `head_sha`: python-semantic-release
# refuses to release from a detached HEAD ("cannot match any release
# groups"), which checking out a bare SHA produces. workflow_run fires
# right after CI completes, so in practice this is still the commit CI
# just validated.
#
# python-semantic-release inspects the commits since the last tag: a `fix:`
# bumps patch, `feat:` bumps minor, a "BREAKING CHANGE:" footer bumps major;
# anything else (chore:, ci:, docs:, test:, refactor:, ...) does not trigger
# a release at all.
#
# This only bumps pyproject.toml, commits, tags, and publishes the GitHub
# Release -- release.yml (triggered by `release: published`) still does the
# actual build/test/attach, exactly as it does for a manually-cut release.
#
# Needs a PAT in the RELEASE_PAT secret, not the default GITHUB_TOKEN: a push
# or release made with the default token does not trigger other workflows
# (GitHub's own loop-prevention), which would silently stop release.yml from
# ever running.
name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.RELEASE_PAT }}

      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ secrets.RELEASE_PAT }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "github-actions[bot]@users.noreply.github.com"
          build: false
          changelog: false
          commit: true
          tag: true
          push: true
          vcs_release: true
