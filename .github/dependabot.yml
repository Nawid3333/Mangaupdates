# Dependabot configuration for pip dependencies and workflow actions.
# Weekly update PRs for requirements.txt and pyproject.toml -- the runtime
# dependencies, the dev tools in the [dev] extra (ruff, pyright, pytest, ...)
# and setuptools in [build-system] -- and for the actions the workflows pin.
#
# Note: You must also enable Dependabot in the repository settings
# (Settings > Code security > Dependabot alerts/version updates).
version: 2
updates:
  # 'increase' raises each '>=' floor to the new release, one PR per package.
  # Left unset, Dependabot picked a strategy per repository from PyPI: the
  # ones whose package name is not taken there got 'widen_ranges', under
  # which '>=x' already allows every newer release, so their pip jobs ran
  # weekly and never opened a PR. watchmaker only got its PRs because an
  # unrelated package on PyPI happens to share its name.
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'

  # Workflow actions are pinned to a commit SHA (with the version as a comment),
  # so a moved or hijacked tag cannot change what runs. Nothing arrives on its
  # own any more; without this the pins would rot (checkout and setup-python
  # once sat three majors behind until a Node 20 deprecation warning made it
  # visible). Dependabot updates the SHA and the comment together; minor and
  # patch releases come as one grouped PR a week, a new major on its own.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      actions-minor-and-patch:
        update-types: ['minor', 'patch']
